# Eager debounce: register key immediately on press, debounce on release.
# This makes modifier+key combos across split halves much more responsive.
# Press = 5ms (near-instant registration), Release = 15ms (filter chatter)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=15
